services:
  postgres:
    image: postgres:16
    container_name: ai-doc-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME}']
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - aidoc-networks

  redis:
    image: redis:7-alpine
    container_name: ai_doc_redis
    ports:
      - '6379:6379'
    networks:
      - aidoc-networks

  minio:
    image: minio/minio
    container_name: ai_doc_minio
    restart: always
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - aidoc-networks

networks:
  aidoc-networks:

volumes:
  postgres_data:
  redis_data:
  minio_data:
